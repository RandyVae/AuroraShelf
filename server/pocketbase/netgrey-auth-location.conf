    # BEGIN NETGREY AUTH & STATIC HARDENING
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location = /Netgrey.apk {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /var/www/netgrey/admin/;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /admin/index.html =404;
    }

    location = /auth-api {
        default_type application/json;
        return 200 '{"service":"Netgrey account API","health":"/auth-api/api/health"}';
    }

    location = /auth-api/ {
        default_type application/json;
        return 200 '{"service":"Netgrey account API","health":"/auth-api/api/health"}';
    }

    location = /auth-api/_ {
        return 404;
    }

    location ^~ /auth-api/_/ {
        return 404;
    }

    location ^~ /auth-api/api/collections/_superusers {
        return 404;
    }

    location ^~ /auth-api/api/admins {
        return 404;
    }

    location ^~ /auth-api/api/backups {
        return 404;
    }

    location ^~ /auth-api/api/settings {
        return 404;
    }

    location ^~ /auth-api/api/logs {
        return 404;
    }

    location = /auth-api/api/health {
        proxy_pass http://127.0.0.1:8090/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /auth-api;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location ~ ^/auth-api/(api/collections/users/(?:records(?:/[A-Za-z0-9_-]+)?|auth-with-password|auth-refresh|request-verification|confirm-verification|request-password-reset|confirm-password-reset))$ {
        rewrite ^/auth-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /auth-api;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location /auth-api/ {
        return 404;
    }

    # Allow only the public mirror manifest JSON; deny all other sensitive/internal file extensions in static root.
    location = /source-manifest.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    location ~* \.(json|py|sh|bak|old|tmp)$ {
        return 404;
    }
    # END NETGREY AUTH & STATIC HARDENING

name: AuroraShelf
options:
  bundleIdPrefix: com.aurorashelf
  deploymentTarget:
    iOS: "26.4"
targets:
  AuroraShelf:
    type: application
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: AuroraShelf
        excludes:
          - "Resources/www"
      - path: AuroraShelf/Resources/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorashelf.app
        INFOPLIST_FILE: AuroraShelf/Resources/Info.plist
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 252
        MARKETING_VERSION: "2.16.26"
        DEVELOPMENT_TEAM: "U4MXHLA3GF"
        CODE_SIGN_STYLE: "Automatic"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
  AuroraShelfTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: AuroraShelfTests
    dependencies:
      - target: AuroraShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorashelf.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"

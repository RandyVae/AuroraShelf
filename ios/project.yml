name: AuroraShelf
options:
  bundleIdPrefix: com.aurorashelf
  deploymentTarget:
    iOS: "26.0"
targets:
  AuroraShelf:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AuroraShelf
        excludes:
          - "Resources/www"
          - "Resources/SourceSecrets.plist"
      - path: AuroraShelf/Resources/www
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Generate Source Secrets
        script: |
          python3 "${SRCROOT}/../scripts/generate_ios_source_secrets.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorashelf.app
        INFOPLIST_FILE: AuroraShelf/Resources/Info.plist
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: 265
        MARKETING_VERSION: "2.16.39"
        DEVELOPMENT_TEAM: "U4MXHLA3GF"
        CODE_SIGN_STYLE: "Automatic"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
  AuroraShelfTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AuroraShelfTests
    dependencies:
      - target: AuroraShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorashelf.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"

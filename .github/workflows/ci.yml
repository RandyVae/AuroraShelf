name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-and-game-checks:
    name: Scripts, OTA Service & Game Logic Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify cross-platform version consistency
        run: bash scripts/publish_ota.sh --check-versions

      - name: Compile-check OTA backend service (Python)
        run: python3 -m py_compile scripts/server/ota_service.py scripts/generate_ios_source_secrets.py

      - name: Syntax-check release and deployment shell scripts
        run: |
          bash -n \
            scripts/publish_ota.sh \
            scripts/build_ios_signed.sh \
            scripts/publish_testflight.sh \
            scripts/deploy_auth_backend.sh \
            scripts/configure_auth_proxy.sh \
            scripts/verify_auth_api.sh

      - name: Verify built-in game deterministic logic & Spine lifecycle
        run: |
          node scripts/verify-game-logic.js
          node scripts/verify-fixes.js

  android-unit-and-lint:
    name: Android Unit Tests & Lint (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests and debug lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
